name: Audit

# Checks dependencies for known vulnerabilities every week, so a new advisory shows up as a failed
# run. Fails on any vulnerability in the runtime dependencies (bundled into the page) and on moderate
# or worse in the build and test ones. Also runs on every pull request, so one that adds or updates
# a vulnerable dependency shows it before merging. Not a required check: an advisory published for
# an unchanged dependency would otherwise block unrelated pull requests until it is fixed.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '24.x'

    - run: npm ci

    - name: Runtime dependencies (bundled into the page)
      run: npm audit --omit=dev

    - name: All dependencies, moderate or worse
      run: npm audit --audit-level=moderate
