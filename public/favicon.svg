<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#0d1f18"/>
      <stop offset="1" stop-color="#030303"/>
    </radialGradient>
    <pattern id="stripes" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="44" height="44" fill="#030303"/>
      <rect width="22" height="44" fill="#ff0080"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.82) translate(-249 -284)">
  <!-- gauge track: 180° arc, centre (256,300), radius 160 -->
  <path d="M 96 300 A 160 160 0 0 1 416 300" fill="none" stroke="#00ff9d" stroke-opacity="0.18" stroke-width="40" stroke-linecap="round"/>
  <!-- safe zone (0–75%) -->
  <path d="M 96 300 A 160 160 0 0 1 369.1 186.9" fill="none" stroke="#00ff9d" stroke-width="40" stroke-linecap="round"/>
  <!-- limit zone (88–100%) -->
  <path d="M 406.1 245.3 A 160 160 0 0 1 416 300" fill="none" stroke="#ff0080" stroke-width="40" stroke-linecap="round"/>
  <!-- needle at ~70% -->
  <line x1="256" y1="300" x2="345" y2="181" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <circle cx="256" cy="300" r="30" fill="#ffffff"/>
  <!-- gate bar -->
  <rect x="86" y="368" width="340" height="56" rx="14" fill="url(#stripes)" stroke="#ff0080" stroke-width="6"/>
  <rect x="62" y="352" width="38" height="96" rx="10" fill="#00ff9d"/>
  </g>
</svg>
